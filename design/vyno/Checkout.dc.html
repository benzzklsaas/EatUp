<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --blue-900: oklch(22% 0.085 264); --blue-700: oklch(38% 0.16 264); --blue-600: oklch(46% 0.19 264);
      --blue-500: oklch(58% 0.18 264); --blue-300: oklch(82% 0.07 252); --blue-100: oklch(96% 0.02 250);
      --cream: oklch(97% 0.014 80); --paper: oklch(99% 0.006 90); --ink: oklch(19% 0.03 264); --ink-soft: oklch(45% 0.03 264);
      --coral: oklch(73% 0.16 36); --coral-deep: oklch(60% 0.17 32); --line: oklch(90% 0.012 260);
    }
    body{ margin:0; font-family:'Manrope',ui-sans-serif,system-ui,sans-serif; background:transparent; }
    .display{ font-family:'Sora',ui-sans-serif,system-ui,sans-serif; }
  </style>
</helmet>

<div style="width:430px; height:880px; position:relative; display:flex; align-items:center; justify-content:center;">
  <div style="width:402px; height:844px; border-radius:56px; background:oklch(14% 0.01 264); padding:12px; box-shadow:0 40px 80px -30px oklch(15% 0.02 264 / 0.55), 0 0 0 1px oklch(30% 0.02 264 / 0.4);">
    <div style="width:100%; height:100%; border-radius:46px; overflow:hidden; position:relative; background:var(--cream);">

      <div style="position:absolute; top:14px; left:50%; transform:translateX(-50%); width:100px; height:28px; border-radius:14px; background:#000; z-index:5;"></div>

      <div style="padding:64px 22px 0; height:100%; box-sizing:border-box; display:flex; flex-direction:column;">

        <div style="display:flex; align-items:center; gap:14px; margin-bottom:22px;">
          <div style="width:36px; height:36px; border-radius:50%; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </div>
          <span class="display" style="font-size:18px; font-weight:800; color:var(--ink);">Your order</span>
        </div>

        <!-- items -->
        <div style="display:flex; flex-direction:column; gap:14px; margin-bottom:24px;">
          <div style="display:flex; align-items:center; gap:12px;">
            <div style="width:52px; height:52px; border-radius:14px; flex-shrink:0; background:radial-gradient(circle at 32% 28%, oklch(80% 0.14 60), oklch(56% 0.15 40) 70%);"></div>
            <div style="flex:1;">
              <div style="font-size:14px; font-weight:700; color:var(--ink);">Poulet rôti bowl <span style="color:var(--ink-soft); font-weight:600;">×1</span></div>
              <div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">Regular</div>
            </div>
            <span style="font-size:14px; font-weight:700; color:var(--ink);">12,90 €</span>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <div style="width:52px; height:52px; border-radius:14px; flex-shrink:0; background:radial-gradient(circle at 32% 28%, oklch(78% 0.13 90), oklch(56% 0.13 70) 70%);"></div>
            <div style="flex:1;">
              <div style="font-size:14px; font-weight:700; color:var(--ink);">Citron gingembre <span style="color:var(--ink-soft); font-weight:600;">×1</span></div>
              <div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">33 cl</div>
            </div>
            <span style="font-size:14px; font-weight:700; color:var(--ink);">3,50 €</span>
          </div>
        </div>

        <!-- pickup time -->
        <div style="font-size:13px; font-weight:700; color:var(--ink); margin-bottom:10px;">Pickup time</div>
        <div style="display:flex; gap:8px; margin-bottom:24px;">
          <span style="padding:11px 14px; border-radius:14px; border:1.5px solid var(--line); font-size:13px; font-weight:700; color:var(--ink-soft);">18:40</span>
          <span style="padding:11px 14px; border-radius:14px; background:var(--blue-700); font-size:13px; font-weight:700; color:var(--cream);">18:50</span>
          <span style="padding:11px 14px; border-radius:14px; border:1.5px solid var(--line); font-size:13px; font-weight:700; color:var(--ink-soft);">19:00</span>
          <span style="padding:11px 14px; border-radius:14px; border:1.5px solid var(--line); font-size:13px; font-weight:700; color:var(--ink-soft);">19:10</span>
        </div>

        <!-- summary card -->
        <div style="border-radius:22px; background:var(--paper); border:1px solid var(--line); padding:18px 20px; margin-bottom:auto;">
          <div style="display:flex; justify-content:space-between; font-size:13.5px; color:var(--ink-soft); margin-bottom:10px;"><span>Subtotal</span><span>16,40 €</span></div>
          <div style="display:flex; justify-content:space-between; font-size:13.5px; color:var(--ink-soft); margin-bottom:10px;"><span>Service fee</span><span>0,60 €</span></div>
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--coral-deep); font-weight:700; border-top:1px dashed var(--line); padding-top:10px; margin-top:10px;">
            <span style="display:flex; align-items:center; gap:6px;"><span style="width:5px;height:5px;border-radius:50%;background:var(--coral);display:inline-block;"></span>0€ to a delivery platform</span>
            <span>+0,00 €</span>
          </div>
        </div>

        <div style="padding:18px 0 24px;">
          <button style="width:100%; height:58px; border:none; border-radius:999px; background:linear-gradient(135deg, var(--blue-600), var(--blue-800)); color:var(--cream); font-family:'Sora',sans-serif; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:space-between; padding:0 24px; box-shadow:0 18px 34px -14px oklch(38% 0.16 264 / 0.55);">
            <span>Pay &amp; reserve</span><span>17,00 €</span>
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
